[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
remappings = ["@mstblockchain/=node_modules/@mstblockchain/"]
solc_version = "0.8.24"

[rpc_endpoints]
mst_testnet = "${MST_TESTNET_RPC_URL}"

